# herdr-plugin.toml — registers herdr-bellwethr with herdr.
#
#   herdr plugin link ~/ws/herdr-bellwethr
#
# Only the delete picker needs to be a plugin: herdr hands a pane to draw a
# fuzzy list in only to a registered plugin. Everything else is a plain command.

id = "herdr-bellwethr"
name = "Herdr Bellwethr"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Save the current herdr space as a herdr-plus project, and delete saved ones from a fuzzy picker."
platforms = ["linux", "macos"]

# Runs server-side with no terminal, so all it can do is ask herdr for the
# picker pane below. HERDR_BIN_PATH is the portable way back into the CLI.
[[actions]]
id = "delete"
title = "Bellwethr: delete a project"
platforms = ["linux", "macos"]
command = ["/bin/sh", "-c", "\"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin herdr-bellwethr --entrypoint delete-picker --placement overlay"]

# The command is relative because herdr runs a pane's command with the plugin
# root as its working directory. --notify because the pane disappears the moment
# the picker exits, taking whatever it printed with it.
[[panes]]
id = "delete-picker"
title = "Delete project"
placement = "overlay"
platforms = ["linux", "macos"]
command = ["./herdr-bellwethr", "delete", "--pick", "--notify"]
