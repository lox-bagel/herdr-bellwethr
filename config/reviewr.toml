# reviewr's own config, linked into persiyanov.reviewr's config dir by dev-link.
# Not herdr's: settings in ~/.config/herdr/config.toml never reach it.

# reviewr's own default, `uncommitted`, is empty whenever the work is already
# committed — the usual state when reviewing an agent's finished branch.
# `branch` is the same diff the pull request shows.
#
# The base branch is not set here: reviewr reads it from `origin/HEAD`. A repo
# created locally and pushed has no such ref, and the header reads `no base`
# until you run `git remote set-head origin -a` once. `B` overrides it per repo,
# `--base <ref>` per pane.
default_scope = "branch"
