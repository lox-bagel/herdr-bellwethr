onboarding = false

# Every binding needs a `description`: it is what the prefix+? help menu shows,
# and without one herdr lists the entry with no name.

# The quick-action launcher. Everything in herdr-plus's quick-actions/ dir is
# reachable from here, so a new action needs no new keybind.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "Quick actions"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "herdr-lazy: manage plugins"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "Herdr Plus: projects"

# `shell`, not `pane`: a pane binding would add a pane to the very space being
# saved. Detached, so --notify is the only way the result reaches anyone.
[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "herdr-bellwethr save --notify --force"
description = "Herdr Plus: save project"

# shift+v because plain v splits a pane vertically, and reviewr's own suggested
# cmd+r is a chord many terminals eat before herdr sees it.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle diff pane"

# Plain key acts on the pane, shift on the tab, following herdr's own pairing
# (prefix+x closes a pane, prefix+shift+x a tab). m was free in both.
#
# drovr needs node >= 23 and fzf, and is inert without either — see the README's
# dependency table.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "drovr.move-pane"
description = "drovr: move pane to tab"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "drovr.move-tab"
description = "drovr: move tab to workspace"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
