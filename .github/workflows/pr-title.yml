# A squash merge takes its default subject from the PR title, so this is the
# one route to main that the commit-msg hook never sees.
#
# No third-party action on purpose: a marketplace action for one regex would
# mean trusting somebody else's code with a token.

name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is Conventional Commits
        env:
          # Through the environment, never interpolated into the script body:
          # a title is attacker-controlled text, and ${{ ... }} inline would run
          # whatever shell somebody put in it.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Keep in step with BELLWETHR_TYPES in hooks/common.sh and the subject
          # rules in hooks/commit-msg. Change one, change the other.
          types='feat|fix|docs|refactor|chore|test|build|ci'

          if ! printf '%s' "$TITLE" | grep -Eq "^(${types})(\([a-z0-9][a-z0-9-]*\))?!?: .+"; then
            echo "::error::PR title is not Conventional Commits: $TITLE"
            echo "format:  <type>[(scope)][!]: <subject>"
            echo "types:   $(printf '%s' "$types" | tr '|' ' ')"
            echo "example: feat(hooks): refuse an off-convention branch name"
            exit 1
          fi

          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; the limit is 72."
            exit 1
          fi

          description=${TITLE#*: }

          case "$description" in
            [A-Z]*)
              echo "::error::PR title description starts with a capital; keep it lowercase."
              exit 1
              ;;
            *.)
              echo "::error::PR title description ends with a period; drop it."
              exit 1
              ;;
          esac

          echo "ok: $TITLE"
